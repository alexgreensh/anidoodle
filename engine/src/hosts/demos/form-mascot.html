<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join the Paper Club · a form with a friend</title>
<meta name="description" content="An anidoodle interactive demo: a hand-drawn mascot that reads along, looks away for your password, and cheers when you sign up.">
<style>
  :root { --paper: #fbf6ea; --ink: #3d3437; --ink-soft: #6b5f62; --rose: #c9566b; --rose-soft: #f2899c; --butter: #f3d577; --sage: #5f8f62; --line: rgba(61,52,55,.2); --err: #b33a4f; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(1200px 600px at 80% -10%, #fff3d6, transparent 60%), var(--paper); font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 28px 18px; -webkit-font-smoothing: antialiased; }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  .card { width: min(1020px, 100%); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: #fffdf7; border: 2px solid var(--ink); border-radius: 26px; box-shadow: 8px 8px 0 var(--butter); overflow: hidden; }
  form { padding: 40px 40px 34px; display: flex; flex-direction: column; gap: 16px; }
  .kicker { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
  h1 { font-size: 38px; line-height: 1.05; margin: 2px 0 4px; letter-spacing: -.02em; font-weight: 600; }
  .sub { margin: 0 0 6px; color: var(--ink-soft); }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 14.5px; }
  .field { position: relative; }
  input { width: 100%; font: 17px/1.2 ui-sans-serif, system-ui, sans-serif; padding: 14px 16px; border: 2px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); transition: border-color .15s ease, box-shadow .15s ease; }
  input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 4px rgba(243,213,119,.55); }
  input[aria-invalid="true"] { border-color: var(--err); }
  .pw input { padding-right: 96px; }
  .reveal { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 600 13px/1 ui-sans-serif, system-ui, sans-serif; padding: 9px 11px; border-radius: 10px; border: 1.5px solid var(--line); background: #fbf6ea; color: var(--ink); cursor: pointer; }
  .reveal[aria-pressed="true"] { background: var(--butter); border-color: var(--ink); }
  .reveal:focus-visible, .submit:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }
  .msg { min-height: 22px; font-size: 14.5px; color: var(--err); margin: 0; }
  .msg.ok { color: var(--sage); }
  .submit { margin-top: 6px; font: 700 17px/1 ui-sans-serif, system-ui, sans-serif; padding: 17px 22px; border-radius: 999px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; box-shadow: 4px 4px 0 var(--rose-soft); transition: transform .15s ease, box-shadow .15s ease, background .2s ease; }
  .submit:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--rose-soft); }
  .submit:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--rose-soft); }
  .submit[disabled] { opacity: .8; cursor: progress; }
  .submit.done { background: var(--sage); border-color: var(--sage); box-shadow: 4px 4px 0 var(--butter); }
  .fine { font-size: 13px; color: var(--ink-soft); margin: 4px 0 0; }
  .art { background: #fbf6ea; border-left: 2px solid var(--ink); display: flex; flex-direction: column; justify-content: center; }
  .art ani-doodle { display: block; }
  .art p { margin: 0; padding: 0 24px 22px; font-size: 13.5px; color: var(--ink-soft); text-align: center; }
  @media (max-width: 820px) { .card { grid-template-columns: 1fr; } .art { order: -1; border-left: 0; border-bottom: 2px solid var(--ink); } .art ani-doodle { max-width: 340px; margin: 0 auto; } form { padding: 28px 22px; } }
</style>
</head>
<body>
  <main class="card">
    <form id="f" novalidate>
      <span class="kicker">The Paper Club</span>
      <h1 class="serif">Join us. Bit will keep you company.</h1>
      <p class="sub">A monthly letter of hand-drawn things. No spam, one robot.</p>
      <label>Your name <input id="name" name="name" autocomplete="name" data-anidoodle="name" placeholder="Ada"></label>
      <label>Email <input id="email" name="email" type="email" autocomplete="email" data-anidoodle="email" placeholder="ada@example.org"></label>
      <label>Password
        <span class="field pw"><input id="password" name="password" type="password" autocomplete="new-password" data-anidoodle="password" placeholder="8 characters or more">
        <button type="button" class="reveal" data-anidoodle="reveal" aria-pressed="false" aria-controls="password">Show</button></span>
      </label>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <button class="submit" data-anidoodle="submit" type="submit">Create my account</button>
      <p class="fine">Bit only ever sees how long your answers are and where your cursor is, never what you type.</p>
    </form>
    <div class="art">
      <ani-doodle piece="form-mascot"></ani-doodle>
      <p>He reads along. He looks away for passwords.</p>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id), bit = () => document.querySelector("ani-doodle");
    const f = $("f"), msg = $("msg"), pw = $("password"), rv = document.querySelector(".reveal"), btn = document.querySelector(".submit");
    let state = "idle";
    const set = (s) => { state = s; bit()?.setState(s); };
    // the toggle keeps focus in the password field, so Bit stays covering his eyes unless he is caught peeking
    rv.addEventListener("mousedown", (e) => e.preventDefault());
    rv.addEventListener("click", () => { const on = rv.getAttribute("aria-pressed") !== "true"; rv.setAttribute("aria-pressed", String(on)); rv.textContent = on ? "Hide" : "Show"; pw.type = on ? "text" : "password"; if (state === "idle" || state === "peek") set(on ? "peek" : "idle"); });
    f.addEventListener("input", (e) => { e.target.removeAttribute("aria-invalid"); if (state === "error") { msg.textContent = ""; set(rv.getAttribute("aria-pressed") === "true" ? "peek" : "idle"); } });
    f.addEventListener("submit", (e) => {
      e.preventDefault(); if (state === "busy" || state === "success") return;
      const bad = [];
      if (!$("name").value.trim()) bad.push(["name", "Bit would love to know your name."]);
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($("email").value)) bad.push(["email", "That email doesn't look quite right."]);
      if (pw.value.length < 8) bad.push(["password", "Passwords need 8 characters or more."]);
      if (bad.length) { bad.forEach(([id]) => $(id).setAttribute("aria-invalid", "true")); msg.className = "msg"; msg.textContent = bad[0][1]; set("error"); return; }
      msg.className = "msg"; msg.textContent = ""; btn.disabled = true; btn.textContent = "Winding up..."; set("busy");
      setTimeout(() => { set("success"); btn.disabled = false; btn.classList.add("done"); btn.textContent = "Welcome aboard!"; msg.className = "msg ok"; msg.textContent = "You're in. Check your inbox for a hand-drawn hello."; }, 1100);
    });
  </script>
<!--anidoodle-->
</body>
</html>
