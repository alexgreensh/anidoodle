<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- RED fixture for the brand contact sheet: a soft (gradient) mask fades the right half in the browser; the import cannot draw a soft mask, so the sheet must FAIL -->
  <defs><linearGradient id="fade"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient></defs>
  <mask id="soft"><rect width="100" height="100" fill="url(#fade)"/></mask>
  <rect width="100" height="100" fill="#FFD900" mask="url(#soft)"/>
</svg>
